<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
  <title id="title">RoboData architecture</title>
  <desc id="desc">Four source families flow through source evidence, RoboData IR, and the RDX typed transformation runtime into delivery contracts and customer formats.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07111f"/>
      <stop offset="1" stop-color="#101b31"/>
    </linearGradient>
    <linearGradient id="core" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5b5cf0"/>
      <stop offset="1" stop-color="#2e9be8"/>
    </linearGradient>
    <linearGradient id="engine" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0e9f8a"/>
      <stop offset="1" stop-color="#3bc9a7"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000814" flood-opacity="0.35"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0 0L10 5L0 10Z" fill="#6f819f"/>
    </marker>
    <style>
      .eyebrow{font:600 13px Inter,ui-sans-serif,system-ui,sans-serif;letter-spacing:2px;fill:#7dd3fc}
      .title{font:700 34px Inter,ui-sans-serif,system-ui,sans-serif;fill:#f8fbff}
      .subtitle{font:400 16px Inter,ui-sans-serif,system-ui,sans-serif;fill:#a7b5ca}
      .section{font:700 13px Inter,ui-sans-serif,system-ui,sans-serif;letter-spacing:1.6px;fill:#8292aa}
      .boxTitle{font:700 18px Inter,ui-sans-serif,system-ui,sans-serif;fill:#f8fbff}
      .boxText{font:400 13px Inter,ui-sans-serif,system-ui,sans-serif;fill:#b9c6d8}
      .pill{font:600 12px Inter,ui-sans-serif,system-ui,sans-serif;fill:#d8e4f4}
      .mono{font:600 12px ui-monospace,SFMono-Regular,Menlo,monospace;fill:#e6f6ff}
    </style>
  </defs>

  <rect width="1200" height="680" rx="24" fill="url(#bg)"/>
  <circle cx="1050" cy="-40" r="240" fill="#2246a0" opacity="0.14"/>
  <circle cx="430" cy="720" r="260" fill="#0e9f8a" opacity="0.09"/>

  <text x="58" y="58" class="eyebrow">ROBODATA</text>
  <text x="58" y="100" class="title">Facts in. Verifiable data products out.</text>
  <text x="58" y="130" class="subtitle">A semantic IR and typed exchange runtime for heterogeneous robotics data.</text>

  <text x="58" y="180" class="section">SOURCE EVIDENCE</text>
  <text x="304" y="180" class="section">SEMANTIC CORE</text>
  <text x="607" y="180" class="section">TYPED TRANSFORMATION</text>
  <text x="914" y="180" class="section">DELIVERY PRODUCTS</text>

  <g filter="url(#shadow)">
    <rect x="58" y="204" width="190" height="68" rx="14" fill="#14233a" stroke="#2a3c58"/>
    <rect x="58" y="284" width="190" height="68" rx="14" fill="#14233a" stroke="#2a3c58"/>
    <rect x="58" y="364" width="190" height="68" rx="14" fill="#14233a" stroke="#2a3c58"/>
    <rect x="58" y="444" width="190" height="68" rx="14" fill="#14233a" stroke="#2a3c58"/>
  </g>
  <text x="80" y="234" class="boxTitle">UMI</text><text x="80" y="255" class="boxText">video · gripper · motion</text>
  <text x="80" y="314" class="boxTitle">Egocentric</text><text x="80" y="335" class="boxText">media · hands · body</text>
  <text x="80" y="394" class="boxTitle">Physical robot</text><text x="80" y="415" class="boxText">sensors · state · commands</text>
  <text x="80" y="474" class="boxTitle">Simulation</text><text x="80" y="495" class="boxText">observations · actions · truth</text>

  <path d="M258 238H288M258 318H288M258 398H288M258 478H288" stroke="#6f819f" stroke-width="2" marker-end="url(#arrow)"/>

  <g filter="url(#shadow)">
    <rect x="304" y="204" width="265" height="308" rx="20" fill="url(#core)"/>
  </g>
  <text x="330" y="240" class="eyebrow" fill="#dff6ff">RDIR</text>
  <text x="330" y="273" class="boxTitle">RoboData IR</text>
  <text x="330" y="299" class="boxText" fill="#ecf5ff">Components · async streams · versions</text>

  <g>
    <rect x="330" y="328" width="98" height="32" rx="16" fill="#ffffff" opacity="0.14"/>
    <rect x="439" y="328" width="102" height="32" rx="16" fill="#ffffff" opacity="0.14"/>
    <rect x="330" y="370" width="110" height="32" rx="16" fill="#ffffff" opacity="0.14"/>
    <rect x="451" y="370" width="90" height="32" rx="16" fill="#ffffff" opacity="0.14"/>
    <rect x="330" y="412" width="112" height="32" rx="16" fill="#ffffff" opacity="0.14"/>
    <rect x="453" y="412" width="88" height="32" rx="16" fill="#ffffff" opacity="0.14"/>
    <rect x="330" y="454" width="211" height="32" rx="16" fill="#ffffff" opacity="0.14"/>
    <text x="349" y="349" class="pill">Time</text><text x="458" y="349" class="pill">Geometry</text>
    <text x="349" y="391" class="pill">Semantics</text><text x="470" y="391" class="pill">Quality</text>
    <text x="349" y="433" class="pill">Capabilities</text><text x="472" y="433" class="pill">Access</text>
    <text x="349" y="475" class="pill">Provenance &amp; stable identity</text>
  </g>

  <path d="M579 358H591" stroke="#6f819f" stroke-width="2" marker-end="url(#arrow)"/>

  <g filter="url(#shadow)">
    <rect x="607" y="204" width="265" height="308" rx="20" fill="#112b31" stroke="#1cb99b" stroke-width="1.5"/>
  </g>
  <text x="633" y="240" class="eyebrow" fill="#78f0d2">RDX</text>
  <text x="633" y="273" class="boxTitle">Robot Data Exchange</text>
  <text x="633" y="299" class="boxText">Plan · validate · execute · report</text>
  <path d="M633 330H846" stroke="#23515a"/>
  <text x="633" y="357" class="mono">01  capability check</text>
  <text x="633" y="389" class="mono">02  typed transform graph</text>
  <text x="633" y="421" class="mono">03  lineage + loss report</text>
  <text x="633" y="453" class="mono">04  target-reader test</text>
  <rect x="633" y="472" width="213" height="20" rx="10" fill="url(#engine)" opacity="0.9"/>
  <text x="654" y="486" style="font:700 10px Inter,ui-sans-serif,system-ui,sans-serif;letter-spacing:1px;fill:#05241e">CONTRACT-CHECKED RELEASE</text>

  <path d="M882 358H898" stroke="#6f819f" stroke-width="2" marker-end="url(#arrow)"/>

  <g filter="url(#shadow)">
    <rect x="914" y="204" width="228" height="68" rx="14" fill="#14233a" stroke="#2a3c58"/>
    <rect x="914" y="284" width="228" height="68" rx="14" fill="#14233a" stroke="#2a3c58"/>
    <rect x="914" y="364" width="228" height="68" rx="14" fill="#14233a" stroke="#2a3c58"/>
    <rect x="914" y="444" width="228" height="68" rx="14" fill="#14233a" stroke="#2a3c58"/>
  </g>
  <text x="936" y="234" class="boxTitle">LeRobot</text><text x="936" y="255" class="boxText">training-ready views</text>
  <text x="936" y="314" class="boxTitle">MCAP</text><text x="936" y="335" class="boxText">schema-aware streams</text>
  <text x="936" y="394" class="boxTitle">Customer ABI</text><text x="936" y="415" class="boxText">contract-specific layouts</text>
  <text x="936" y="474" class="boxTitle">Optimized views</text><text x="936" y="495" class="boxText">browse · train · audit</text>

  <rect x="58" y="554" width="1084" height="78" rx="18" fill="#0c1728" stroke="#263750"/>
  <text x="82" y="582" class="section">INVARIANTS</text>
  <text x="82" y="611" style="font:400 12px Inter,ui-sans-serif,system-ui,sans-serif;fill:#b9c6d8">measured ≠ estimated ≠ commanded ≠ executed</text>
  <circle cx="395" cy="605" r="3" fill="#3bc9a7"/>
  <text x="412" y="611" style="font:400 12px Inter,ui-sans-serif,system-ui,sans-serif;fill:#b9c6d8">logical identity ≠ file location</text>
  <circle cx="644" cy="605" r="3" fill="#3bc9a7"/>
  <text x="661" y="611" style="font:400 12px Inter,ui-sans-serif,system-ui,sans-serif;fill:#b9c6d8">source evidence ≠ delivery view</text>
  <circle cx="910" cy="605" r="3" fill="#3bc9a7"/>
  <text x="927" y="611" style="font:400 12px Inter,ui-sans-serif,system-ui,sans-serif;fill:#b9c6d8">unknown stays unknown</text>

  <text x="58" y="660" style="font:500 12px Inter,ui-sans-serif,system-ui,sans-serif;fill:#5f708a">ROBODATA ARCHITECTURE · DESIGN BASELINE</text>
</svg>
