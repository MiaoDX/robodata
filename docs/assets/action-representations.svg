<svg xmlns="http://www.w3.org/2000/svg" width="764" height="364" viewBox="0 0 764 364" role="img" aria-labelledby="t d" font-family="Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif">
<title id="t">Action representations</title><desc id="d">The same four poses encoded as absolute poses, relative to a fixed anchor, and as stepwise deltas.</desc>
<defs><marker id="ar" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#5b6475"/></marker>
<marker id="arb" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#3b6fb6"/></marker>
<marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#c0392b"/></marker></defs>
<rect width="764" height="364" rx="14" fill="#ffffff"/>
<text x="24" y="34" font-size="18" font-weight="700" fill="#1f2430" text-anchor="start" >One trajectory, three action representations</text>
<text x="24" y="56" font-size="12.5" font-weight="400" fill="#5b6475" text-anchor="start" >Same poses T_0…T_3. Values differ, and so does how errors accumulate when a policy replays them.</text>
