<rect x="24" y="304" width="716" height="44" rx="8" fill="#f5f7fa"/>
<text x="38" y="322" font-size="11.5" font-weight="400" fill="#1f2430" text-anchor="start" >Mixed representations are normal: arm pose anchor-relative, gripper width absolute (metres).</text>
<text x="38" y="338" font-size="11.5" font-weight="400" fill="#5b6475" text-anchor="start" >RDIR declares representation, reference frame, reference instant, units and rotation convention per action slice.</text></svg>